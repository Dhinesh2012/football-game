<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Dhinesh FC - Match</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#087b2d;
    height:100vh;
    color:white;
}

/* SCORE */
.score{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,20,10,.92);
    padding:10px 25px;
    border-radius:14px;
    z-index:20;
    text-align:center;
    font-weight:bold;
}

.score small{
    display:block;
    color:#ffd83d;
    font-size:11px;
    margin-bottom:3px;
}

/* FIELD */
.field{
    position:absolute;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        90deg,
        #087b2d 0px,
        #087b2d 75px,
        #0a8432 75px,
        #0a8432 150px
    );
}

/* FIELD LINES */
.midline{
    position:absolute;
    width:3px;
    height:100%;
    background:rgba(255,255,255,.8);
    left:50%;
}

.center{
    position:absolute;
    width:145px;
    height:145px;
    border:3px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.centerDot{
    position:absolute;
    width:9px;
    height:9px;
    background:white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* GOALS */
.goal{
    position:absolute;
    width:20%;
    height:28%;
    border:3px solid white;
    top:36%;
}

.leftGoal{
    left:0;
    border-left:0;
}

.rightGoal{
    right:0;
    border-right:0;
}

/* PLAYERS */
.player{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    border:3px solid white;
    box-shadow:0 3px 10px #003b15;
    z-index:8;
}

.blue{
    background:#168cff;
}

.red{
    background:#e73535;
}

/* PLAYER POSITIONS */
#p1{left:45%;top:27%}
#p2{left:27%;top:38%}
#p3{left:63%;top:38%}
#p4{left:38%;top:52%}
#p5{left:55%;top:52%}

#op1{left:25%;top:65%}
#op2{left:62%;top:65%}
#op3{left:44%;top:72%}

/* BALL */
.ball{
    position:absolute;
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
    left:50%;
    top:48%;
    z-index:10;
    border:2px solid #222;
}

/* JOYSTICK */
.joystick{
    position:fixed;
    left:25px;
    bottom:35px;
    width:120px;
    height:120px;
    border:2px solid rgba(255,255,255,.5);
    border-radius:50%;
    background:rgba(0,0,0,.18);
}

.stick{
    position:absolute;
    width:55px;
    height:55px;
    background:rgba(255,255,255,.85);
    border-radius:50%;
    left:32px;
    top:32px;
}

/* BUTTONS */
.controls{
    position:fixed;
    right:20px;
    bottom:25px;
    width:180px;
    height:190px;
}

.btn{
    position:absolute;
    border-radius:50%;
    border:3px solid white;
    font-weight:bold;
    font-size:14px;
    color:white;
    box-shadow:0 4px 10px #003c18;
}

.pass{
    width:75px;
    height:75px;
    right:90px;
    bottom:70px;
    background:#147ee8;
}

.shoot{
    width:82px;
    height:82px;
    right:0;
    bottom:10px;
    background:#e53232;
}

.sprint{
    width:75px;
    height:75px;
    right:0;
    bottom:105px;
    background:#333;
}

/* TIMER */
.timer{
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.55);
    padding:5px 14px;
    border-radius:10px;
    font-weight:bold;
    z-index:20;
}

/* MESSAGE */
.message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:34px;
    font-weight:900;
    text-shadow:0 3px 8px #000;
    display:none;
    z-index:30;
}
</style>
</head>

<body>

<div class="score">
    <small>DIVISION 5 • QUICK MATCH</small>
    DHINESH FC &nbsp; <span id="score">0 - 0</span> &nbsp; OPPONENT
</div>

<div class="timer">
    <span id="time">00:00</span>
</div>

<div class="field">

    <div class="midline"></div>

    <div class="center">
        <div class="centerDot"></div>
    </div>

    <div class="goal leftGoal"></div>
    <div class="goal rightGoal"></div>

    <!-- MY TEAM -->
    <div class="player blue" id="p1">91</div>
    <div class="player blue" id="p2">86</div>
    <div class="player blue" id="p3">87</div>
    <div class="player blue" id="p4">84</div>
    <div class="player blue" id="p5">88</div>

    <!-- OPPONENT -->
    <div class="player red" id="op1">84</div>
    <div class="player red" id="op2">86</div>
    <div class="player red" id="op3">89</div>

    <div class="ball" id="ball"></div>

</div>

<!-- JOYSTICK -->
<div class="joystick" id="joystick">
    <div class="stick" id="stick"></div>
</div>

<!-- CONTROLS -->
<div class="controls">

    <button class="btn pass" onclick="passBall()">
        PASS
    </button>

    <button class="btn sprint" onclick="sprint()">
        SPRINT
    </button>

    <button class="btn shoot" onclick="shoot()">
        SHOOT
    </button>

</div>

<div class="message" id="message"></div>

<script>

/* TIMER */

let seconds = 0;

setInterval(() => {

    seconds++;

    let min =
        String(Math.floor(seconds / 60)).padStart(2,"0");

    let sec =
        String(seconds % 60).padStart(2,"0");

    document.getElementById("time").innerText =
        min + ":" + sec;

},1000);


/* MESSAGE */

function showMessage(text){

    const m =
        document.getElementById("message");

    m.innerText = text;
    m.style.display = "block";

    setTimeout(() => {
        m.style.display = "none";
    },900);
}


/* PASS */

function passBall(){

    showMessage("PASS!");

    const ball =
        document.getElementById("ball");

    ball.style.left = "60%";
    ball.style.top = "52%";
}


/* SHOOT */

function shoot(){

    showMessage("⚽ SHOOT!");

    setTimeout(() => {

        let goal =
            Math.random() > .55;

        if(goal){

            document.getElementById("score")
                .innerText = "1 - 0";

            showMessage("⚽ GOAL!");

        }else{

            showMessage("SAVE!");

        }

    },700);
}


/* SPRINT */

function sprint(){

    showMessage("⚡ SPRINT!");

}


/* JOYSTICK */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

const player =
    document.getElementById("p1");

let dragging = false;

joystick.addEventListener(
    "touchstart",
    () => {
        dragging = true;
    }
);

joystick.addEventListener(
    "touchmove",
    e => {

        if(!dragging) return;

        const touch = e.touches[0];

        const rect =
            joystick.getBoundingClientRect();

        let x =
            touch.clientX -
            rect.left -
            60;

        let y =
            touch.clientY -
            rect.top -
            60;

        const distance =
            Math.sqrt(x*x+y*y);

        if(distance > 35){

            x = x / distance * 35;
            y = y / distance * 35;

        }

        stick.style.transform =
            `translate(${x}px,${y}px)`;

        let left =
            player.offsetLeft + x * .15;

        let top =
            player.offsetTop + y * .15;

        player.style.left =
            Math.max(
                0,
                Math.min(
                    window.innerWidth-48,
                    left
                )
            ) + "px";

        player.style.top =
            Math.max(
                80,
                Math.min(
                    window.innerHeight-48,
                    top
                )
            ) + "px";
    }
);

joystick.addEventListener(
    "touchend",
    () => {

        dragging = false;

        stick.style.transform =
            "translate(0,0)";
    }
);

</script>

</body>
</html>
