<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Dhinesh FC - Match</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

body{
    overflow:hidden;
    background:#07120b;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

/* GAME */
#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#16852c;
}

/* FIELD */
#field{
    position:absolute;
    width:100%;
    height:100%;
    background:
        repeating-linear-gradient(
            90deg,
            #16852c 0px,
            #16852c 80px,
            #198d30 80px,
            #198d30 160px
        );
}

/* FIELD LINES */
.line{
    position:absolute;
    background:rgba(255,255,255,.8);
}

.center-line{
    width:3px;
    height:100%;
    left:50%;
    transform:translateX(-50%);
}

.center-circle{
    position:absolute;
    width:180px;
    height:180px;
    border:3px solid rgba(255,255,255,.8);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.center-dot{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* PENALTY AREAS */
.box{
    position:absolute;
    width:27%;
    height:32%;
    top:34%;
    border:3px solid rgba(255,255,255,.8);
}

.left-box{
    left:0;
    border-left:0;
}

.right-box{
    right:0;
    border-right:0;
}

.goal{
    position:absolute;
    width:6%;
    height:14%;
    top:43%;
    border:4px solid white;
}

.left-goal{
    left:0;
    border-left:0;
}

.right-goal{
    right:0;
    border-right:0;
}

/* SCOREBOARD */
#scoreboard{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    min-width:310px;
    padding:12px 20px;
    border-radius:14px;
    background:rgba(5,20,10,.9);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:20;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.club-score{
    text-align:center;
    font-weight:bold;
}

.club-score small{
    display:block;
    color:#b8c8bd;
    font-size:11px;
}

.score{
    font-size:28px;
    margin-top:2px;
}

#timer{
    font-size:15px;
    font-weight:bold;
    color:#ffd83d;
}

/* PLAYER */
.player{
    position:absolute;
    width:48px;
    height:65px;
    text-align:center;
    z-index:8;
    transition:transform .08s linear;
}

.card{
    width:42px;
    height:52px;
    margin:auto;
    background:linear-gradient(145deg,#e9c85c,#966a15);
    clip-path:polygon(
        50% 0%,90% 13%,85% 78%,
        50% 100%,15% 78%,10% 13%
    );
    display:flex;
    align-items:center;
    justify-content:center;
    color:#17210e;
    font-weight:900;
    font-size:15px;
}

.player-name{
    color:white;
    font-size:9px;
    font-weight:bold;
    margin-top:1px;
    text-shadow:0 2px 3px #000;
}

.selected{
    filter:drop-shadow(0 0 8px #00eaff);
}

/* BALL */
#ball{
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    background:white;
    border:2px solid #222;
    z-index:15;
    box-shadow:0 2px 5px rgba(0,0,0,.5);
}

/* CONTROLS */
#joystick{
    position:absolute;
    bottom:35px;
    left:28px;
    width:145px;
    height:145px;
    border:2px solid rgba(255,255,255,.45);
    border-radius:50%;
    background:rgba(0,0,0,.12);
    z-index:30;
}

#stick{
    position:absolute;
    width:62px;
    height:62px;
    border-radius:50%;
    background:rgba(235,245,235,.85);
    left:41px;
    top:41px;
}

/* BUTTONS */
.buttons{
    position:absolute;
    right:25px;
    bottom:30px;
    width:210px;
    height:180px;
    z-index:30;
}

.action{
    position:absolute;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.7);
    color:white;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
}

#shoot{
    width:78px;
    height:78px;
    right:0;
    bottom:0;
    background:#e53935;
}

#pass{
    width:68px;
    height:68px;
    left:0;
    bottom:50px;
    background:#1976d2;
}

#sprint{
    width:70px;
    height:70px;
    right:15px;
    top:0;
    background:rgba(20,30,20,.55);
}

.action:active{
    transform:scale(.9);
}

/* MATCH MESSAGE */
#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:100;
    color:white;
    font-size:38px;
    font-weight:900;
    text-shadow:0 4px 10px #000;
    display:none;
    text-align:center;
}

#message small{
    display:block;
    font-size:16px;
    margin-top:8px;
}

/* PAUSE */
#pause{
    position:absolute;
    right:15px;
    top:18px;
    z-index:30;
    width:40px;
    height:40px;
    border-radius:50%;
    border:0;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:18px;
}
</style>
</head>

<body>

<div id="game">

    <div id="field">

        <div class="line center-line"></div>
        <div class="center-circle"></div>
        <div class="center-dot"></div>

        <div class="box left-box"></div>
        <div class="box right-box"></div>

        <div class="goal left-goal"></div>
        <div class="goal right-goal"></div>

    </div>

    <!-- SCORE -->
    <div id="scoreboard">

        <div class="club-score">
            <small>DHINESH FC</small>
            <div class="score" id="myScore">0</div>
        </div>

        <div id="timer">00:00</div>

        <div class="club-score">
            <small>REAL UNITED</small>
            <div class="score" id="enemyScore">0</div>
        </div>

    </div>

    <!-- PLAYERS -->

    <div class="player selected"
         id="p1"
         style="left:47%;top:45%;">
        <div class="card">91</div>
        <div class="player-name">DHRUV</div>
    </div>

    <div class="player"
         style="left:25%;top:35%;">
        <div class="card">86</div>
        <div class="player-name">SAM</div>
    </div>

    <div class="player"
         style="left:68%;top:35%;">
        <div class="card">87</div>
        <div class="player-name">VIVEK</div>
    </div>

    <div class="player"
         style="left:35%;top:50%;">
        <div class="card">84</div>
        <div class="player-name">VIKAS</div>
    </div>

    <div class="player"
         style="left:58%;top:50%;">
        <div class="card">87</div>
        <div class="player-name">RAHUL</div>
    </div>

    <div class="player"
         style="left:18%;top:67%;">
        <div class="card">81</div>
        <div class="player-name">ROHAN</div>
    </div>

    <div class="player"
         style="left:35%;top:67%;">
        <div class="card">85</div>
        <div class="player-name">KARAN</div>
    </div>

    <div class="player"
         style="left:58%;top:67%;">
        <div class="card">84</div>
        <div class="player-name">DEV</div>
    </div>

    <div class="player"
         style="left:75%;top:67%;">
        <div class="card">80</div>
        <div class="player-name">ADITYA</div>
    </div>

    <div class="player"
         style="left:47%;top:79%;">
        <div class="card">82</div>
        <div class="player-name">ARJUN</div>
    </div>

    <!-- OPPONENT -->
    <div class="player"
         style="left:47%;top:8%;filter:hue-rotate(150deg);">
        <div class="card">90</div>
        <div class="player-name">ALEX</div>
    </div>

    <div id="ball"></div>

    <!-- JOYSTICK -->
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="buttons">

        <div class="action" id="sprint">
            SPRINT
        </div>

        <div class="action" id="pass">
            PASS
        </div>

        <div class="action" id="shoot">
            SHOOT
        </div>

    </div>

    <button id="pause" onclick="pauseGame()">Ⅱ</button>

    <div id="message">
        GOAL!
        <small>DHINESH FC</small>
    </div>

</div>

<script>

let seconds = 0;
let paused = false;

let score1 = 0;
let score2 = 0;

const timer = document.getElementById("timer");
const ball = document.getElementById("ball");
const player = document.getElementById("p1");

let playerX = window.innerWidth * .49;
let playerY = window.innerHeight * .48;

let ballX = playerX + 15;
let ballY = playerY + 25;

function updateTimer(){

    if(paused) return;

    seconds++;

    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    timer.innerText =
        String(min).padStart(2,"0") +
        ":" +
        String(sec).padStart(2,"0");

    if(seconds >= 90){
        endMatch();
    }
}

setInterval(updateTimer,1000);


/* POSITION PLAYER */

function updatePlayer(){

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";

    ballX = playerX + 15;
    ballY = playerY + 55;

    ball.style.left = ballX + "px";
    ball.style.top = ballY + "px";
}

updatePlayer();


/* JOYSTICK */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let dragging = false;

joystick.addEventListener("pointerdown", e => {
    dragging = true;
    joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener("pointermove", e => {

    if(!dragging || paused) return;

    const rect = joystick.getBoundingClientRect();

    let x = e.clientX - rect.left - rect.width/2;
    let y = e.clientY - rect.top - rect.height/2;

    let distance = Math.sqrt(x*x + y*y);
    let max = 40;

    if(distance > max){

        x = x/distance*max;
        y = y/distance*max;

    }

    stick.style.transform =
        `translate(${x}px,${y}px)`;

    playerX += x * .10;
    playerY += y * .10;

    playerX = Math.max(0,Math.min(window.innerWidth-50,playerX));
    playerY = Math.max(70,Math.min(window.innerHeight-120,playerY));

    updatePlayer();

});

joystick.addEventListener("pointerup", () => {

    dragging = false;
    stick.style.transform = "translate(0,0)";

});


/* PASS */

document.getElementById("pass").addEventListener("pointerdown",()=>{

    if(paused) return;

    ball.style.transition = ".25s";

    ballX += 90;

    if(ballX > window.innerWidth-40){
        ballX = window.innerWidth-40;
    }

    ball.style.left = ballX+"px";

});


/* SHOOT */

document.getElementById("shoot").addEventListener("pointerdown",()=>{

    if(paused) return;

    ball.style.transition = ".5s";

    let targetX = window.innerWidth-5;
    let targetY = window.innerHeight/2;

    ball.style.left = targetX+"px";
    ball.style.top = targetY+"px";

    setTimeout(()=>{

        score1++;

        document.getElementById("myScore").innerText = score1;

        showGoal();

        resetBall();

    },550);

});


/* SPRINT */

document.getElementById("sprint").addEventListener("pointerdown",()=>{

    if(paused) return;

    playerX += 90;

    if(playerX > window.innerWidth-70){
        playerX = window.innerWidth-70;
    }

    updatePlayer();

});


/* GOAL */

function showGoal(){

    const msg = document.getElementById("message");

    msg.style.display="block";

    setTimeout(()=>{
        msg.style.display="none";
    },1500);

}


/* RESET BALL */

function resetBall(){

    setTimeout(()=>{

        ballX = playerX + 15;
        ballY = playerY + 55;

        ball.style.transition=".2s";
        ball.style.left=ballX+"px";
        ball.style.top=ballY+"px";

    },800);

}


/* PAUSE */

function pauseGame(){

    paused = !paused;

    document.getElementById("pause").innerText =
        paused ? "▶" : "Ⅱ";

}


/* END */

function endMatch(){

    paused = true;

    const msg = document.getElementById("message");

    msg.innerHTML =
        "FULL TIME" +
        "<small>DHINESH FC " +
        score1 +
        " - " +
        score2 +
        " REAL UNITED</small>";

    msg.style.display="block";

}

</script>

</body>
</html>
